<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan DOM & API</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Latihan DOM & API</h1>

    <button id="darkMode">Dark Mode</button>


    <form id="formMahasiswa">
        <label>Nama:</label>
    <input type="text" id="nama">

    <label>NIM:</label>
    <input type="text" id="nim">

    <label>Jurusan:</label>
    <input type="text" id="jurusan">

    <label>Nilai:</label>
    <input type="number" id="nilai">

    <button type="submit">Tambah</button>
    </form>

    <h2>Daftar Post</h2>

    <input type="text" id="search" placeholder="Cari berdasarkan title...">

    <div id="posts"></div>

    <button id="previous">Previous</button>
    <button id="next">Next</button>

    <h2>Todo List</h2>

    <input type="text" id="todoInput" placeholder="Masukkan tugas">

    <button id="tambahTodo">Tambah</button>

    <ul id="todoList"></ul>


    <div id="result"></div>

    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan Array & Objek</title>
</head>
<body>
    <h1>Latihan Array & Objek</h1>

    <input type="text" id="nama" placeholder="Nama">
    <input type="text" id="nim" placeholder="NIM">
    <input type="text" id="jurusan" placeholder="Jurusan">
    <input type="number" id="nilai" placeholder="Nilai">

    <button id="tambah">Tambah Mahasiswa</button>

    <table border="1">
    <thead>
        <tr>
            <th>Nama</th>
            <th>NIM</th>
            <th>Jurusan</th>
            <th>Nilai</th>
        </tr>
    </thead>
    <tbody id="result"></tbody>
    </table>

    <div id="resultt"></div>

    <script src="script.js"></script>
</body>
</html>

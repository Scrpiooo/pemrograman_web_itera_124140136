<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas Praktikum</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1> Kasir Mini POS </h1>

    <form id="formBarang">
        <div>
            <label for="namaBarang">Nama Barang</label>
            <input 
                type="text" 
                id="namaBarang" 
                placeholder="Masukkan nama barang (minimal 3 karakter)">
            <p id="errorNama" class="error"></p>
        </div>

        <div>
            <label for="hargaBarang">Harga Satuan</label>
            <input 
                type="number" 
                id="hargaBarang" 
                placeholder="Minimal Rp500">
            <p id="errorHarga" class="error"></p>
        </div>

        <div>
            <label for="qtyBarang">Jumlah / Qty</label>
            <input 
                type="number" 
                id="qtyBarang" 
                placeholder="Minimal 1">
            <p id="errorQty" class="error"></p>
        </div>

        <button type="submit">Tambah ke Keranjang</button>
    </form>

    <h2>Keranjang Belanja</h2>

    <table border="1">
    <thead>
        <tr>
            <th>Nama Barang</th>
            <th>Harga</th>
            <th>Qty</th>
            <th>Subtotal</th>
            <th>Aksi</th>
        </tr>
    </thead>

    <tbody id="keranjang"></tbody>
    </table>

    <button id="resetTransaksi">Reset Transaksi</button>

    <h2>Perhitungan</h2>

    <p>Subtotal: <span id="subtotal">Rp0</span></p>
    <p>Diskon: <span id="diskon">Rp0</span></p>
    <p>Total Belanja: <span id="total">Rp0</span></p>

    <label for="uangBayar">Uang Bayar</label>
    <input
        type="number"
        id="uangBayar"
        placeholder="Masukkan uang pembayaran">
    <p>Kembalian: <span id="kembalian">Rp0</span></p>

    <script src="script.js"></script>
</body>
</html>
